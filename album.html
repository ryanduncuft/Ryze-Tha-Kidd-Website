<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Album & EP Discography | Ryze Tha Kidd</title>

    <!-- Robots Meta Tag (Keeping noindex until full SSR implementation) -->
    <meta name="robots" content="noindex, follow">
    
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Explore official album and EP releases by British rapper and producer Ryze Tha Kidd. Stream tracklists, releases, and physical media options.">
    <meta name="author" content="Ryze Tha Kidd">
    <meta name="theme-color" content="#9D00FF">

    <!-- Open Graph / Facebook Fallback -->
    <meta property="og:type" content="music.album">
    <meta property="og:url" content="https://www.ryzethakidd.com/album.html">
    <meta property="og:title" content="Album & EP Releases | Ryze Tha Kidd">
    <meta property="og:description" content="Explore official album and EP releases by British rapper and producer Ryze Tha Kidd. Stream tracklists, releases, and physical media options.">
    <meta property="og:image" content="https://res.cloudinary.com/dvju1xiaw/image/upload/f_auto,q_auto/v1792020777/Logo-rtk_dzt3wv.png">
    <meta property="og:locale" content="en_GB">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@ryzethakidd">
    <meta name="twitter:title" content="Album & EP Releases | Ryze Tha Kidd">
    <meta name="twitter:description" content="Explore official album and EP releases by British rapper and producer Ryze Tha Kidd. Stream tracklists, releases, and physical media options.">
    <meta name="twitter:image" content="https://res.cloudinary.com/dvju1xiaw/image/upload/f_auto,q_auto/v1792020777/Logo-rtk_dzt3wv.png">

    <!-- Performance & Preconnect -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://res.cloudinary.com">
    <link rel="icon" href="/WebpageIcon.ico" type="image/x-icon">
    <link rel="icon" href="/WebpageIcon.png" type="image/png" sizes="192x192">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.ryzethakidd.com/shared/site.css">

    <!-- Fallback Brand Schema -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "MusicGroup",
        "name": "Ryze Tha Kidd",
        "url": "https://www.ryzethakidd.com",
        "genre": ["Emo Rap", "Hip Hop", "Trap Music"]
    }
    </script>

    <script>
        window.ARTIST_ID = "ryzethakidd"; 
    </script>
    <script src="https://cdn.ryzethakidd.com/shared/main.js" defer></script>
</head>

<body>
    <canvas aria-hidden="true" id="interactive-bg"></canvas>

    <header id="navbar-container"></header>

    <div class="d-flex flex-column position-relative">
        <main class="w-100 container flex-grow-1 release-page" id="main-content">
            <header class="release-page-hero page-hero text-center text-lg-start">
                <p class="eyebrow">Release Catalog</p>
                <h1 class="text-gradient fw-black display-5 mb-2">Album / EP Details</h1>
                <p class="text-muted max-w-text mb-0">Full metadata, listening links, and tracklist.</p>
            </header>

            <!-- Loading State -->
            <div class="text-muted mt-8 text-center" id="loading-state">
                <i class="fas fa-compact-disc fa-spin fs-1 text-gradient"></i>
                <p class="fs-5 mt-4">Loading Album Details...</p>
            </div>

            <!-- Error State -->
            <div class="text-center mt-8 d-none text-danger" id="error-state">
                <p class="fs-5"><strong>ERROR 404:</strong> Album or EP not found. Please verify the URL or link.</p>
                <a class="btn btn-primary mt-4" href="/discography">Back to Discography</a>
            </div>

            <!-- Content Section -->
            <section class="d-none" id="album-details">
                <div class="row g-4 g-lg-5 align-items-start release-detail-grid">
                    <div class="col-12 col-lg-5">
                        <div class="album-cover-container">
                            <img id="album-image" class="w-100 rounded-3 shadow-lg" src="" alt="Official Album Cover Art">
                            <div class="album-type-badge mt-3">
                                <span class="fs-6 badge bg-gradient" id="album-type"></span>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-lg-7">
                        <div class="album-info">
                            <h1 class="text-gradient fw-black display-4 display-md-3 lh-1 mb-3" id="album-title"></h1>
                            <p class="text-muted fs-4 fs-md-3 fw-light mb-4" id="album-artist"></p>
                            
                            <div class="album-metadata">
                                <div class="row g-3 g-md-4">
                                    <div class="col-6">
                                        <small class="text-muted d-block fw-bold mb-2 text-uppercase">Release Date</small>
                                        <p class="fs-6 mb-0" id="album-date"></p>
                                    </div>
                                    <div class="col-6">
                                        <small class="text-muted d-block fw-bold mb-2 text-uppercase">Type</small>
                                        <p class="fs-6 mb-0 text-capitalize" id="album-type-text"></p>
                                    </div>
                                    <div class="col-6">
                                        <small class="text-muted d-block fw-bold mb-2 text-uppercase">Track Count</small>
                                        <p class="fs-6 mb-0" id="album-track-count"></p>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex flex-column album-actions flex-md-row gap-3">
                                <a class="btn btn-lg btn-primary" href="#" id="listen-btn" rel="noopener noreferrer" target="_blank">
                                    <i class="fas me-2 fa-play-circle"></i> Stream Release
                                </a>
                                <a class="btn btn-lg btn-outline-primary" href="/discography">
                                    <i class="fas me-2 fa-arrow-left"></i> Back to Discography
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-4 release-support-grid">
                    <div class="col-12">
                        <div class="album-tracklist border-subtle card surface">
                            <div class="card-body p-4 p-md-5">
                                <h2 class="fw-bold h4 mb-4">Official Tracklist</h2>
                                <div class="tracklist" id="tracklist-container"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer id="footer-container"></footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
