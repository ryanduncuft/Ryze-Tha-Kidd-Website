<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 - Lost in Space | Ryze Tha Kidd</title>

    <!-- Performance: Preconnect to font and image servers -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="http://salehriaz.com">

    <!-- Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <!-- Canonical & Icons -->
    <link rel="canonical" href="https://www.ryzethakidd.com/404">
    <link rel="icon" href="/WebpageIcon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="./css/site.css">

    <style>
        @import url('https://fonts.googleapis.com/css?family=Dosis:300,400,500');

        /* GPU Optimized Animations */
        @keyframes rocket-movement {
            100% { transform: translate(1200px, -600px); }
        }
        @keyframes spin-earth {
            100% { transform: rotate(-360deg); }
        }
        @keyframes move-astronaut {
            100% { transform: translate(-160px, -160px); }
        }
        @keyframes rotate-astronaut {
            100% { transform: rotate(-720deg); }
        }
        @keyframes glow-star {
            40% { opacity: 0.3; }
            90%, 100% { opacity: 1; transform: scale(1.2); }
        }

        body, html {
            margin: 0;
            width: 100%;
            height: 100%;
            user-select: none;
            overflow-x: hidden;
        }

        .bg-space {
            background: radial-gradient(circle at center, rgba(128, 0, 128, 0.1), transparent 50%);
            background-color: #000; /* Fallback */
            height: 100%;
        }

        .central-body {
            padding: 17% 5% 10% 5%;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .central-body p {
            color: var(--text-secondary);
            font-size: clamp(1rem, 4vw, 1.125rem);
            margin: 20px 0;
        }

        .objects img {
            z-index: 90;
            pointer-events: none;
            will-change: transform; /* Signals GPU to prepare for animation */
        }

        .object_rocket {
            position: absolute;
            transform: translateX(-50px);
            top: 75%;
            animation: rocket-movement 200s linear infinite both running;
        }

        .object_earth {
            position: absolute;
            top: 20%;
            left: 15%;
            animation: spin-earth 100s infinite linear both;
        }

        .object_moon {
            position: absolute;
            top: 12%;
            left: 25%;
        }

        .box_astronaut {
            z-index: 110;
            position: absolute;
            top: 60%;
            right: 20%;
            animation: move-astronaut 50s infinite linear both alternate;
        }

        .object_astronaut {
            animation: rotate-astronaut 200s infinite linear both alternate;
        }

        .image-404 {
            position: relative;
            z-index: 100;
            width: 100%;
            max-width: 300px;
            height: auto;
        }

        .stars {
            background: url('http://salehriaz.com/404Page/img/overlay_stars.svg');
            background-repeat: repeat;
            background-size: contain;
            background-position: left top;
        }

        .glowing_stars .star {
            position: absolute;
            border-radius: 100%;
            background-color: #fff;
            width: 3px;
            height: 3px;
            opacity: 0.3;
            will-change: opacity;
        }

        /* Star Placements */
        .star:nth-child(1) { top: 80%; left: 25%; animation: glow-star 2s infinite alternate 1s; }
        .star:nth-child(2) { top: 20%; left: 40%; animation: glow-star 2s infinite alternate 3s; }
        .star:nth-child(3) { top: 25%; left: 25%; animation: glow-star 2s infinite alternate 5s; }
        .star:nth-child(4) { top: 75%; left: 80%; animation: glow-star 2s infinite alternate 7s; }
        .star:nth-child(5) { top: 90%; left: 50%; animation: glow-star 2s infinite alternate 9s; }

        .btn-go-home, .btn-discography, .btn-contact {
            position: relative;
            z-index: 200;
            margin: 10px;
            min-width: 140px;
            padding: 12px 15px;
            border: 1px solid var(--accent);
            border-radius: 100px;
            display: inline-block;
            color: #fff;
            text-decoration: none;
            letter-spacing: 2px;
            font-size: 11px;
            transition: all 0.3s ease;
        }

        .btn-go-home:hover, .btn-discography:hover, .btn-contact:hover {
            background-color: var(--accent);
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(157, 0, 255, 0.2);
        }

        @media (max-width: 600px) {
            .central-body { padding-top: 25%; }
            .btn-go-home, .btn-discography, .btn-contact { width: 120px; font-size: 10px; }
        }
    </style>
</head>

<body class="bg-space d-flex flex-column min-vh-100 stars">
    <!-- Skip to Content for Accessibility -->
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <!-- Navigation Header -->
    <header id="navbar-container"></header>

    <main class="flex-grow-1" id="main-content">
        <div class="central-body">
            <img alt="404 Error - Page Not Found" class="image-404" src="http://salehriaz.com/404Page/img/404.svg">
            <p>Oops! Looks like you're lost in space.</p>
            <div class="d-flex flex-wrap justify-content-center">
                <a class="btn-go-home" href="/">GO HOME</a>
                <a class="btn-discography" href="discography">DISCOGRAPHY</a>
                <a class="btn-contact" href="contact">CONTACT</a>
            </div>
        </div>

        <!-- Animated Space Objects -->
        <div class="objects">
            <img alt="Rocket" class="object_rocket" src="http://salehriaz.com/404Page/img/rocket.svg" width="40">
            <div class="earth-moon">
                <img alt="Earth" class="object_earth" src="http://salehriaz.com/404Page/img/earth.svg" width="100">
                <img alt="Moon" class="object_moon" src="http://salehriaz.com/404Page/img/moon.svg" width="80">
            </div>
            <div class="box_astronaut">
                <img alt="Astronaut" class="object_astronaut" src="http://salehriaz.com/404Page/img/astronaut.svg" width="140">
            </div>
        </div>

        <!-- Animated Background Stars -->
        <div class="glowing_stars">
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
        </div>
    </main>

    <!-- Footer Container -->
    <footer id="footer-container"></footer>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js" defer></script>
    <script src="js/main.js" defer></script>
</body>
</html>
