        <!-- Open Graph -->
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://www.ryzethakidd.com/faq">
        <meta property="og:title" content="FAQ | Ryze Tha Kidd">

        <meta property="og:locale" content="en_GB">

        <!-- Twitter -->
        <meta name="twitter:card" content="summary">
        <meta name="twitter:site" content="@ryzethakidd">
        <meta name="twitter:title" content="FAQ | Ryze Tha Kidd">
        <meta name="twitter:description" content="Find answers to frequently asked questions about my music, collaborations, upcoming projects, and video content.">
        <meta name="twitter:image" content="https://res.cloudinary.com/dvju1xiaw/image/upload/f_auto,q_auto/v1777702972/me_xdb3pf.jpg">

        <!-- Canonical & Icons -->
        <link rel="canonical" href="https://www.ryzethakidd.com/faq">
        <link rel="icon" href="/WebpageIcon.ico" type="image/x-icon">
        <link rel="icon" href="/WebpageIcon.png" type="image/png" sizes="192x192">

        <!-- Stylesheets -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
        <link rel="stylesheet" href="https://cdn.ryzethakidd.com/shared/site.css">

        <script>
            window.ARTIST_ID = "ryzethakidd"; 
        </script>
        <script src="https://cdn.ryzethakidd.com/shared/main.js" defer></script>
    </head>

    <body class="d-flex flex-column min-vh-100">
        <!-- Animated Background -->
        <canvas aria-hidden="true" id="interactive-bg"></canvas>

        <!-- Navigation -->
        <header id="navbar-container"></header>

        <main class="flex-grow-1" id="main-content">
            <!-- Hero Section -->
            <section class="text-center page-hero text-lg-start">
                <div class="container">
                    <p class="eyebrow">FAQ</p>
                    <h1 class="display-4 fw-black mb-3"><span class="text-gradient">Frequently </span>Asked Questions</h1>
                </div>
            </section>

            <!-- FAQ Content Area -->
            <section class="pb-5" id="faq-list">
                <div class="container faq-container-narrow">
                    <!-- Grid where JS injects FAQ items -->
                    <div class="faq-videos-grid" id="faq-container"></div>

                    <!-- Loading Spinner: Shown by default, hidden by main.js -->
                    <div class="py-5 text-center" id="faq-loading">
                        <div class="spinner-border text-accent" role="status">
                            <span class="visually-hidden">Loading FAQs...</span>
                        </div>
                        <p class="text-muted mt-3">Fetching Questions...</p>
                    </div>

                    <!-- Error Message: Shown if fetch fails -->
                    <div class="d-none alert alert-warning" id="faq-error" role="alert">
                        <i class="fa-exclamation-triangle fas me-2"></i> Unable to load FAQs. Please try again later.
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer container -->
        <footer id="footer-container"></footer>

        <!-- Scripts -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js" defer></script>
    </body>
</html>
