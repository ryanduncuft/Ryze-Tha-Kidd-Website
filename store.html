<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Shop official Ryze Tha Kidd music, vinyl, merchandise, and digital releases."
    />
    <meta name="theme-color" content="#9D00FF" />
    <title>Store | Ryze Tha Kidd</title>

    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link rel="canonical" href="https://www.ryzethakidd.com/store" />
    <link rel="icon" href="/WebpageIcon.ico" type="image/x-icon" />
    <link rel="icon" href="/WebpageIcon.png" type="image/png" sizes="192x192" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link rel="stylesheet" href="https://cdn.ryzethakidd.com/shared/site.css" />

    <script>
      window.ARTIST_ID = "ryzethakidd";
    </script>
    <script src="https://cdn.ryzethakidd.com/shared/main.js" defer></script>
  </head>
  <body>
    <canvas aria-hidden="true" id="interactive-bg"></canvas>
    <header id="navbar-container"></header>

    <main class="container flex-grow-1 py-5 py-md-7 w-100" id="main-content">
      <!-- Full Store Grid View -->
      <div id="store-grid-view">
        <header class="page-hero mb-5 text-center text-lg-start">
          <p class="eyebrow">Official merchandise</p>
          <h1 class="display-3 display-md-1 fw-black lh-1 text-gradient">
            The Store
          </h1>
          <p class="max-w-text text-muted">
            Purchase CD's, Vinyls, Merchandise and collector;s items from Ryze Tha Kidd. All items are shipped directly from me.
          </p>
        </header>

        <section aria-labelledby="store-products-title" class="pb-0 pt-0">
          <div class="section-head mb-4">
            <div>
              <h2 class="fs-3 fw-bold mb-1" id="store-products-title">
                Available items
              </h2>
              <p class="mb-0 text-muted" id="store-status" role="status">
                Loading the store…
              </p>
            </div>
          </div>
          <div
            aria-live="polite"
            class="store-grid"
            id="store-products"
            aria-busy="true"
          >
            <p class="store-empty-state text-muted">Loading the store…</p>
          </div>
        </section>
      </div>

      <!-- Single Product Full Page View (Loaded dynamically via URL ?id=...) -->
      <div id="store-detail-view" class="d-none">
        <div class="mb-4">
          <a href="/store.html" class="link-arrow">
            <i class="fas fa-arrow-left me-2"></i>Back to Store
          </a>
        </div>
        <div class="row g-5 align-items-start">
          <div class="col-lg-6">
            <div class="store-product-media rounded-4 overflow-hidden border mb-3">
              <img id="detail-image" src="" alt="Product Image" class="w-100 object-fit-cover" style="max-height: 500px;" />
            </div>
            <!-- Dynamic Image Thumbnails Container -->
            <div id="detail-thumbnails" class="d-flex gap-2 flex-wrap"></div>
          </div>
          <div class="col-lg-6 d-flex flex-column gap-3">
            <span id="detail-type" class="text-muted small text-uppercase fw-bold">Merchandise</span>
            <h1 id="detail-title" class="display-5 fw-bold mb-0"></h1>
            <div id="detail-price" class="fs-3 fw-900 text-primary"></div>
            <p id="detail-description" class="text-muted" style="white-space: pre-line;"></p>
            <div class="mt-3">
              <button id="detail-checkout-btn" type="button" class="btn btn-primary btn-lg w-100"></button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer id="footer-container"></footer>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"
      defer
    ></script>
  </body>
</html>
