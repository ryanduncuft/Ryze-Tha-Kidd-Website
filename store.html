<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Shop official Ryze Tha Kidd music, vinyl, merchandise, and digital releases.">
    <meta name="theme-color" content="#9D00FF">
    <title>Store | Ryze Tha Kidd</title>

    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="canonical" href="https://www.ryzethakidd.com/store">
    <link rel="icon" href="/WebpageIcon.ico" type="image/x-icon">
    <link rel="icon" href="/WebpageIcon.png" type="image/png" sizes="192x192">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.ryzethakidd.com/shared/site.css">

    <script>window.ARTIST_ID = "ryzethakidd";</script>
    <script src="https://cdn.ryzethakidd.com/shared/main.js" defer></script>
</head>
<body>
    <canvas aria-hidden="true" id="interactive-bg"></canvas>
    <header id="navbar-container"></header>

    <main class="container flex-grow-1 py-5 py-md-7 w-100" id="main-content">
        <header class="page-hero mb-5 text-center text-lg-start">
            <p class="eyebrow">Official merchandise</p>
            <h1 class="display-3 display-md-1 fw-black lh-1 text-gradient">The Store</h1>
            <p class="max-w-text text-muted">Music, vinyl, apparel, and digital releases—shipped directly from Ryze Tha Kidd.</p>
        </header>

        <section aria-labelledby="store-products-title" class="pb-0 pt-0">
            <div class="section-head mb-4">
                <div>
                    <h2 class="fs-3 fw-bold mb-1" id="store-products-title">Available items</h2>
                    <p class="mb-0 text-muted" id="store-status" role="status">Loading the store…</p>
                </div>
            </div>
            <div aria-live="polite" class="store-grid" id="store-products" aria-busy="true">
                <p class="store-empty-state text-muted">Loading the store…</p>
            </div>
        </section>
    </main>

    <footer id="footer-container"></footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
