# =========================================================================
# PRIMARY REDIRECT RULES & FUNCTIONS ROUTING
# =========================================================================

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# =========================================================================
# 1. SUBDOMAIN DOMAIN-SPECIFIC REWRITES
# =========================================================================

# When a user lands on the root of shop.ryzethakidd.com, serve store.html
[[redirects]]
  from = "/"
  to = "/store.html"
  status = 200
  force = true
  conditions = {Language = [], Country = [], Role = []}
  headers = {Host = "shop.ryzethakidd.com"}

# Handle SSR product view on shop subdomain (e.g. shop.ryzethakidd.com/?id=123)
[[redirects]]
  from = "/"
  query = {id = ":id"}
  to = "/.netlify/functions/store-ssr?id=:id"
  status = 200
  force = true
  headers = {Host = "shop.ryzethakidd.com"}

# If someone on the main domain (www) types /store or /store.html, redirect them to the shop subdomain root
[[redirects]]
  from = "/store"
  to = "https://shop.ryzethakidd.com/"
  status = 301
  force = true

[[redirects]]
  from = "/store.html"
  to = "https://shop.ryzethakidd.com/"
  status = 301
  force = true

# =========================================================================
# 2. CANONICAL & DOMAIN CLEANUP
# =========================================================================

[[redirects]]
  # Redirect old Netlify app subdomain to canonical domain
  from = "https://ryzethakidd.netlify.app/*"
  to = "https://www.ryzethakidd.com/:splat"
  status = 301
  force = true

[[redirects]]
  # Redirect HTTP to secure HTTPS
  from = "http://*"
  to = "https://www.ryzethakidd.com/:splat"
  status = 301
  force = true

# =========================================================================
# 3. ENDPOINTS & API PROXIES
# =========================================================================

# Sitemap Function
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

# Store API Proxying
[[redirects]]
  from = "/api/store/products"
  to = "/.netlify/functions/products"
  status = 200

[[redirects]]
  from = "/api/store/create-checkout-session"
  to = "/.netlify/functions/create-checkout-session"
  status = 200

# Single and Album exact paths bypass
[[redirects]]
  from = "/single"
  to = "/single"
  status = 200

[[redirects]]
  from = "/album"
  to = "/album"
  status = 200

# Block removed FAQ page
[[redirects]]
  from = "/faq"
  to = "/404.html"
  status = 404

# Clean URL rewriting for static HTML pages
[[redirects]]
  from = "/:page"
  to = "/:page.html"
  status = 200

# Catch-all 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404