# =========================================================================
# PRIMARY REDIRECT RULES & FUNCTIONS ROUTING
# =========================================================================

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# =========================================================================
# SUBDOMAIN REDIRECT (Redirect storefront requests to shop.ryzethakidd.com)
# =========================================================================

# Clean redirect for exact /store or /store.html to the shop subdomain root
[[redirects]]
  from = "/store"
  to = "https://shop.ryzethakidd.com/"
  status = 301
  force = true

[[redirects]]
  from = "/store.html"
  to = "https://shop.ryzethakidd.com/"
  status = 301
  force = true

# Wildcard redirect for subpaths like /store/item-name -> shop.ryzethakidd.com/item-name
[[redirects]]
  from = "/store/*"
  to = "https://shop.ryzethakidd.com/:splat"
  status = 301
  force = true

# Store SSR: Route store.html requests on the shop subdomain directly to the SSR serverless function.
[[redirects]]
  from = "/"
  query = {id = ":id"}
  to = "/.netlify/functions/store-ssr?id=:id"
  status = 200
  force = true

# =========================================================================
# OTHER REDIRECT RULES (Prioritized 301 Permanent Redirects)
# =========================================================================

[[redirects]]
  # Rule 1: Redirect old Netlify subdomain to the canonical domain
  from = "https://ryzethakidd.netlify.app/*"
  to = "https://www.ryzethakidd.com/:splat"
  status = 301
  force = true

[[redirects]]
  # Rule 2: Redirect HTTP (all domains) to secure HTTPS
  from = "http://*"
  to = "https://www.ryzethakidd.com/:splat"
  status = 301
  force = true

# Sitemap Function: Route /sitemap.xml directly to the sitemap serverless function
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

# Store API: keep the public endpoints stable while proxying to Functions.
[[redirects]]
  from = "/api/store/products"
  to = "/.netlify/functions/products"
  status = 200

[[redirects]]
  from = "/api/store/create-checkout-session"
  to = "/.netlify/functions/create-checkout-session"
  status = 200

[[redirects]]
  # EXCLUSION: If the path is /single or /album exactly, do NOT rewrite to .html.
  from = "/single"
  to = "/single"
  status = 200

[[redirects]]
  from = "/album"
  to = "/album"
  status = 200

[[redirects]]
  # Permanent 404 block for deleted FAQ page
  from = "/faq"
  to = "/404.html"
  status = 404

[[redirects]]
  # Clean URLs for OTHER static pages (about, contact, etc)
  from = "/:page"
  to = "/:page.html"
  status = 200

[[redirects]]
  # Custom 404 Page Catch-all
  from = "/*"
  to = "/404.html"
  status = 404