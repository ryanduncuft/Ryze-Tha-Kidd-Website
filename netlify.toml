# =========================================================================
# PRIMARY REDIRECT RULES (Prioritized 301 Permanent Redirects)
# =========================================================================

[[redirects]]
  # Rule 1: Redirect old Netlify subdomain to the canonical domain
  from = "https://ryzethakidd.netlify.app/*"
  to = "https://www.ryzethakidd.com/:splat"
  status = 301
  force = true

[[redirects]]
  # Rule 2: Redirect HTTP (all domains) to secure HTTPS
  from = "http://*"
  to = "https://www.ryzethakidd.com/:splat"
  status = 301
  force = true

# =========================================================================
# REWRITE RULES (Modified for "Ugly" Single/Album URLs)
# =========================================================================

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Sitemap Function: Route /sitemap.xml directly to the sitemap serverless function
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

# Store API: keep the public endpoints stable while proxying to Functions.
[[redirects]]
  from = "/api/store/products"
  to = "/.netlify/functions/products"
  status = 200

[[redirects]]
  from = "/api/store/create-checkout-session"
  to = "/.netlify/functions/create-checkout-session"
  status = 200

[[redirects]]
  # EXCLUSION: If the path is /single or /album exactly, do NOT rewrite to .html.
  # This forces the server to look for a folder instead of the file, making /single 404
  # and requiring /single.html
  from = "/single"
  to = "/single"
  status = 200

[[redirects]]
  from = "/album"
  to = "/album"
  status = 200

[[redirects]]
  # Rule 3: Clean URLs for OTHER static pages (about, contact, etc)
  from = "/:page"
  to = "/:page.html"
  status = 200

[[redirects]]
  # Rule 6: Custom 404 Page
  from = "/*"
  to = "/404.html"
  status = 404