    <link rel="canonical" href="https://www.ryzethakidd.com/contact">
    <link rel="icon" href="/WebpageIcon.ico" type="image/x-icon">
    <link rel="icon" href="/WebpageIcon.png" type="image/png" sizes="192x192">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <script>
            window.ARTIST_ID = "ryzethakidd"; 
        </script>
    <script src="https://cdn.ryzethakidd.com/shared/main.js" defer></script>
</head>

<body>
    <!-- Background -->
    <canvas aria-hidden="true" id="interactive-bg"></canvas>

    <!-- Navigation -->
    <header id="navbar-container"></header>

    <div class="d-flex flex-column position-relative">
        <main aria-labelledby="contact-title" class="container flex-grow-1 py-5 py-md-7 w-100" id="main-content">
            <header class="page-hero mb-5 text-center text-lg-start">
                <p class="eyebrow">Contact</p>
                <h1 class="text-gradient display-3 display-md-2 fw-black lh-1 mb-4" id="contact-title">Connect With Me</h1>
            </header>

            <div class="card max-w-form mx-auto p-5 p-md-6 reveal">
                <div class="g-5 g-md-6 row">
                    <!-- Contact Details & Socials -->
                    <div class="d-flex flex-column col-12 col-md-6">
                        <div class="border-accent-minimal border-bottom contact-details-panel mb-6 pb-6">
                            <h2 class="fs-4 fw-bold text-secondary mb-4"><i class="fa-solid text-gradient me-3 fa-headset"></i> CONNECTION LOG</h2>
                            <p class="text-muted fs-6 mb-4">Whether you're a promoter, a fellow artist looking to collab, or just a fan, use the form to get in touch.</p>
                        </div>

                        <div class="social-links-panel">
                            <h2 class="fs-4 fw-bold text-secondary mb-4"><i class="fa-solid text-gradient me-3 fa-bolt"></i> SOCIAL FREQUENCIES</h2>
                            <div class="d-flex gap-4 flex-wrap" aria-label="Social media links">
                                <a class="fs-4 p-4 rounded-3 social-icon-box text-white social-youtube" href="https://www.youtube.com/@RyzeThaKidd" aria-label="YouTube Channel" rel="noopener noreferrer" target="_blank"><i class="fab fa-youtube"></i></a>
                                <a class="fs-4 p-4 rounded-3 social-icon-box text-white social-instagram" href="https://www.instagram.com/ryzethakidd/" aria-label="Instagram Profile" rel="noopener noreferrer" target="_blank"><i class="fab fa-instagram"></i></a>
                                <a class="fs-4 p-4 rounded-3 social-icon-box text-white social-facebook" href="https://www.facebook.com/ryzethakidd" aria-label="Facebook Profile" rel="noopener noreferrer" target="_blank"><i class="fab fa-facebook-f"></i></a>
                                <a class="fs-4 p-4 rounded-3 social-icon-box text-white social-spotify" href="https://open.spotify.com/artist/2TOX7bcrnVTOe3hbzvdi0H?si=vA1eSYX_Qjiy5xtQpRYEOA" aria-label="Spotify Profile" rel="noopener noreferrer" target="_blank"><i class="fab fa-spotify"></i></a>
                                <a class="fs-4 p-4 rounded-3 social-icon-box text-white social-soundcloud" href="https://soundcloud.com/ryzethakidd" aria-label="SoundCloud Profile" rel="noopener noreferrer" target="_blank"><i class="fab fa-soundcloud"></i></a>
                            </div>
                        </div>
                    </div>

                    <!-- Contact Form (Netlify Integrated) -->
                    <div class="col-12 col-md-6">
                        <h2 class="fs-4 fw-bold text-secondary mb-5"><i class="fa-solid text-gradient me-3 fa-code-branch"></i> SEND DATA PACKET</h2>
                        <form action="/success" aria-label="Contact Form" class="d-flex flex-column gap-5" data-netlify="true" method="POST" name="contact">
                            <!-- Netlify Hidden Inputs -->
                            <input name="form-name" type="hidden" value="contact">
                            <p class="d-none">
                                <label>Don't fill this out if you're human: <input name="bot-field"></label>
                            </p>

                            <div class="position-relative">
                                <i class="fa-solid position-absolute small start-3 text-muted top-50 translate-middle-y fa-user"></i>
                                <input name="name" autocomplete="name" class="form-control ps-5" placeholder="Name" required aria-label="Your Name">
                            </div>
                            
                            <div class="position-relative">
                                <i class="fa-solid position-absolute small start-3 text-muted top-50 translate-middle-y fa-envelope"></i>
                                <input name="email" autocomplete="email" class="form-control ps-5" placeholder="Email Address" required type="email" aria-label="Your Email Address">
                            </div>
                            
                            <div class="position-relative">
                                <i class="fa-solid position-absolute small start-3 text-muted fa-message-dots top-3"></i>
                                <textarea class="form-control ps-5" name="message" placeholder="Message/Inquiry Details" required rows="8" aria-label="Your Message"></textarea>
                            </div>
                            
                            <div data-netlify-recaptcha="true"></div>
                            
                            <button class="fw-bold btn btn-lg btn-primary letter-spacing-wider mt-3 text-uppercase" type="submit">
                                TRANSMIT DATA PACKET
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>

        <footer id="footer-container"></footer>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
