<template id="navbar">
<nav class="navbar navbar-expand-lg fixed-top navbar-light" role="banner">
    <div class="container-fluid navbar-container-layout">
        <a class="navbar-brand" href="/">{{artistName}}</a>
        <div class="navbar-nav d-none d-lg-flex navbar-center">{{navLinks}}</div>
        <div class="navbar-controls d-none d-lg-flex">
            <div class="dropdown">
                <button class="btn btn-sm btn-outline-primary dropdown-toggle" data-bs-toggle="dropdown">
                    <i class="fa-solid fa-compass me-2"></i> Tools
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><button class="dropdown-item" data-bs-toggle="offcanvas" data-bs-target="#quickSearchPanel"><i class="fa-solid fa-magnifying-glass me-2"></i> Search</button></li>
                    <li><button id="global-random" class="dropdown-item"><i class="fa-solid fa-shuffle me-2"></i> Surprise</button></li>
                    <li><button class="dropdown-item" data-bs-toggle="offcanvas" data-bs-target="#settingsPanel"><i class="fa-solid fa-sliders me-2"></i> Settings</button></li>
                </ul>
            </div>
        </div>
        <button class="navbar-toggler d-lg-none ms-auto" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="offcanvas offcanvas-end d-lg-none" id="offcanvasNavbar" tabindex="-1">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title">Navigation</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
            </div>
            <div class="offcanvas-body">
                <div class="navbar-nav flex-column w-100">
                    {{mobileNavLinks}}
                    <hr class="my-3">
                    <div class="mt-2 d-flex flex-column gap-2">
                        <button class="btn btn-sm btn-outline-primary w-100" data-bs-toggle="offcanvas" data-bs-target="#quickSearchPanel"><i class="fa-solid fa-magnifying-glass me-2"></i> Search</button>
                        <button id="global-random-mobile" class="btn btn-sm btn-outline-primary w-100"><i class="fa-solid fa-shuffle me-2"></i> Surprise</button>
                        <button class="btn btn-sm btn-outline-primary w-100" data-bs-toggle="offcanvas" data-bs-target="#settingsPanel"><i class="fa-solid fa-sliders me-2"></i> Settings</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</nav>
<aside class="offcanvas offcanvas-end settings-panel" id="settingsPanel" tabindex="-1">
    <div class="offcanvas-header"><h2 class="offcanvas-title">Settings</h2><button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button></div>
    <div class="offcanvas-body">
        <section class="settings-section">
            <h3 class="settings-section-title">Theme</h3>
            <div class="btn-group w-100">{{themeOptions}}</div>
        </section>
        <section class="settings-section">
            <h3 class="settings-section-title">Performance</h3>
            {{performanceToggles}}
        </section>
        <section class="settings-section mobile-only">
            <h3 class="settings-section-title">Mobile Settings</h3>
            {{mobileToggles}}
        </section>
        <section class="settings-section desktop-only">
            <h3 class="settings-section-title">Desktop Settings</h3>
            {{desktopToggles}}
        </section>
    </div>
</aside>
<aside class="offcanvas offcanvas-end search-panel" id="quickSearchPanel" tabindex="-1">
    <div class="offcanvas-header"><h2 class="offcanvas-title">Quick Search</h2><button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button></div>
    <div class="offcanvas-body">
        <div class="input-group mb-3">
            <span class="input-group-text"><i class="fas fa-search"></i></span>
            <input id="quick-search-input" type="search" class="form-control" placeholder="Search music...">
        </div>
        <div id="quick-search-results" class="quick-search-results"></div>
    </div>
</aside>
</template>

<template id="footer">
<footer class="py-5">
    <div class="container">
        <div class="row g-4 justify-content-center text-center">
            <div class="col-12 col-sm-6 col-md-3"><h3 class="mb-3">Navigation</h3><ul class="list-unstyled">{{footerNav}}</ul></div>
            <div class="col-12 col-sm-6 col-md-3"><h3 class="mb-3">Connect</h3>
                <div class="d-flex gap-3 justify-content-center">
                    <a href="{{facebookUrl}}" target="_blank" aria-label="Facebook"><i class="fab fa-facebook-f fa-lg"></i></a>
                    <a href="{{instagramUrl}}" target="_blank" aria-label="Instagram"><i class="fab fa-instagram fa-lg"></i></a>
                    <a href="{{youtubeUrl}}" target="_blank" aria-label="YouTube"><i class="fab fa-youtube fa-lg"></i></a>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-md-3"><h3 class="mb-3">Stream</h3><ul class="list-unstyled">
                <li><a href="{{spotifyUrl}}" target="_blank" class="text-decoration-none">Spotify</a></li>
                <li><a href="{{appleUrl}}" target="_blank" class="text-decoration-none">Apple Music</a></li>
                <li><a href="{{soundcloudUrl}}" target="_blank" class="text-decoration-none">SoundCloud</a></li>
            </ul></div>
            <div class="col-12 col-sm-6 col-md-3"><h3 class="mb-3">System</h3><p class="text-muted">&copy; <span>{{year}}</span> {{artistDisplay}}</p>
            <div class="d-flex flex-column gap-2 align-items-center">
                <button class="btn btn-sm btn-outline-primary" data-bs-toggle="offcanvas" data-bs-target="#settingsPanel">Open Settings</button>
                <button id="clear-cache-btn" class="btn btn-sm btn-outline-secondary">Clear Cache</button>
            </div></div>
        </div>
    </div>
</footer>
</template>

<template id="release-mini">
<div class="release-mini reveal">
    <img src="{{image}}" alt="{{title}} cover" loading="lazy">
    <div>
        <p class="eyebrow mb-2">{{eyebrow}} &bull; {{typeLabel}}</p>
        <h3 class="fs-4 fw-bold mb-2">{{title}}</h3>
        <p class="text-muted mb-3">{{artist}} &bull; {{displayDate}}</p>
        <div class="d-flex flex-wrap gap-2">
            <a href="{{listenUrl}}" target="_blank" class="btn btn-primary btn-sm"><i class="fas fa-play me-2"></i>Listen</a>
            <a href="{{detailUrl}}" class="btn btn-outline-primary btn-sm">View Details</a>
        </div>
    </div>
</div>
</template>

<template id="release-card">
<div class="col reveal">
    <div class="release-card h-100">
        <div class="release-card-image position-relative overflow-hidden rounded-top-3">
            <a href="{{detailUrl}}" class="text-decoration-none">
                <img src="{{image}}" alt="{{title}}" class="w-100 h-100 object-fit-cover" loading="lazy">
                <span class="release-type-tag">{{typeTag}}</span>
            </a>
            <button class="favorite-btn {{favoriteClass}}" data-id="{{id}}">
                <i class="fas fa-star"></i>
            </button>
        </div>
        <div class="release-card-content p-3 p-md-4">
            <h3 class="release-title text-truncate mb-1">{{title}}</h3>
            <p class="text-muted small mb-0">{{artist}}</p>
        </div>
    </div>
</div>
</template>

<template id="latest-release">
<div class="row align-items-center reveal">
    <div class="col-12 col-md-6 mb-4 mb-md-0">
        <img class="img-fluid rounded-3 shadow-lg" src="{{image}}" alt="{{title}}" loading="lazy">
    </div>
    <div class="col-12 col-md-6">
        <h2 class="display-4 fw-bold mb-3">Latest Drop: {{title}}</h2>
        <p class="fs-5 text-muted mb-4">{{displayDate}}</p>
        <a href="{{listenUrl}}" target="_blank" class="btn btn-primary btn-lg"><i class="fas fa-play me-2"></i> Stream Now</a>
    </div>
</div>
</template>

<template id="quick-result">
<a class="quick-result d-flex align-items-center p-2 text-decoration-none" href="{{detailUrl}}">
    <img src="{{image}}" width="40" height="40" class="rounded me-3" alt="">
    <div>
        <div class="fw-bold small text-white">{{title}}</div>
        <div class="text-muted smaller">{{typeTag}}</div>
    </div>
</a>
</template>

<template id="track-item">
<div class="track-item d-flex justify-content-between align-items-center p-3 border-bottom">
    <div class="track-info">
        <span class="me-3 text-muted">{{trackNumber}}</span>
        <strong>{{title}}</strong>
    </div>
    <a href="{{detailUrl}}" class="btn btn-sm btn-outline-primary">Listen</a>
</div>
</template>

<template id="faq-accordion">
<div class="accordion accordion-flush" id="faqAccordion">{{items}}</div>
</template>

<template id="faq-video-item">
<div class="accordion-item faq-video-item bg-transparent border-0 mb-4 reveal">
    <button class="faq-video-card p-0 border-0 w-100" type="button" data-bs-toggle="collapse" data-bs-target="#vid-{{videoId}}">
        <div class="row g-0 align-items-center">
            <div class="col-5 col-md-4"><div class="faq-thumbnail-wrapper"><img src="{{thumbnail}}" class="faq-thumbnail" alt=""><div class="play-overlay"><i class="fas fa-play-circle"></i></div></div></div>
            <div class="col-7 col-md-8 p-3 p-md-4"><h3 class="faq-title fw-bold mb-0">{{title}}</h3></div>
        </div>
    </button>
    <div id="vid-{{videoId}}" class="accordion-collapse collapse" data-bs-parent="#faqAccordion">
        <div class="faq-content-wrapper p-3">{{questions}}
            <a href="{{watchUrl}}" target="_blank" class="btn btn-primary mt-3">Watch Full Video</a>
        </div>
    </div>
</div>
</template>

<template id="faq-qa-item">
<div class="faq-qa-item mb-2">
    <button class="faq-question-btn w-100 text-start" data-bs-toggle="collapse" data-bs-target="#ans-{{videoId}}-{{index}}">{{question}}</button>
    <div id="ans-{{videoId}}-{{index}}" class="collapse mt-2 text-muted">{{answer}}</div>
</div>
</template>
