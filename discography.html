<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Discography | Ryze Tha Kidd</title>
    
        <!-- Performance: Preconnect to CDNs -->
        <link rel="preconnect" href="https://cdnjs.cloudflare.com">
        <link rel="preconnect" href="https://res.cloudinary.com">
    
        <!-- Meta Tags -->
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Discover my complete discography. Stream all albums, EPs, singles, and music collaborations from my entire career.">
        <meta name="keywords" content="Ryze Tha Kidd discography, albums, EPs, singles, music releases, collaborations">
        <meta name="author" content="Ryze Tha Kidd">
    
        <!-- Open Graph -->
        <meta property="og:type" content="music.discography">
        <meta property="og:url" content="https://www.ryzethakidd.com/discography">
        <meta property="og:title" content="Discography | Ryze Tha Kidd">
        <meta property="og:description" content="Discover my complete discography. Stream all albums, EPs, singles, and music collaborations from my entire career.">
        <meta property="og:image" content="https://res.cloudinary.com/dvju1xiaw/image/upload/f_auto,q_auto/v1777702972/me_xdb3pf.jpg">
        <meta property="og:locale" content="en_GB">
    
        <!-- Twitter -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:site" content="@ryzethakidd">
        <meta name="twitter:title" content="Discography | Ryze Tha Kidd">
        <meta name="twitter:image" content="https://res.cloudinary.com/dvju1xiaw/image/upload/f_auto,q_auto/v1777702972/me_xdb3pf.jpg">
    
        <!-- Canonical & Icons -->
        <link rel="canonical" href="https://www.ryzethakidd.com/discography">
        <link rel="icon" href="/WebpageIcon.ico" type="image/x-icon">
        <link rel="icon" href="/WebpageIcon.png" type="image/png" sizes="192x192">
        
        <!-- Stylesheets -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
        <link rel="stylesheet" href="./css/site.css">

        <!-- Structured Data -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "CollectionPage",
                "name": "Discography | Ryze Tha Kidd",
                "url": "https://www.ryzethakidd.com/discography",
                "description": "Discover my complete discography. Stream all albums, EPs, singles, and music collaborations from my entire career."
            }
        </script>
    </head>
    
    <body>
        <canvas aria-hidden="true" id="interactive-bg"></canvas>
    
        <header id="navbar-container"></header>
    
        <div class="d-flex position-relative flex-column">
            <main aria-labelledby="discography-title" class="container flex-grow-1 py-5 py-lg-8 py-md-7 w-100" id="main-content">
                <header class="text-center mb-5 page-hero text-lg-start">
                    <p class="eyebrow">Archive</p>
                    <h1 class="mb-4 display-3 display-md-2 fw-black lh-1 text-gradient" id="discography-title">Discography</h1>
                </header>
            
                <!-- Controls Header (Always visible) -->
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4 gap-3 reveal">
                    <div class="d-flex gap-2 justify-content-center discography-stats flex-wrap" aria-live="polite">
                        <span class="stat-pill" id="release-count">0 Releases</span>
                        <span class="stat-pill" id="album-count">0 Albums</span>
                        <span class="stat-pill" id="favorite-count">0 Favorites</span>
                    </div>
                    <div class="d-flex gap-2 flex-wrap justify-content-center">
                        <button class="btn btn-sm btn-outline-primary" type="button" data-bs-toggle="collapse" data-bs-target="#filterPanel" aria-expanded="false" aria-controls="filterPanel">
                            <i class="fas fa-sliders me-2"></i> Filters & Search
                        </button>
                        <button class="btn btn-sm btn-outline-primary" id="random-release">
                            <i class="fas fa-shuffle me-2"></i> Surprise Me
                        </button>
                    </div>
                </div>
            
                <!-- Collapsible Filtering and Sorting Panel -->
                <div class="collapse mb-5" id="filterPanel">
                    <section aria-label="Discography filtering and sorting" class="discography-controls p-4 p-md-5 surface">
                        
                        <div class="row g-4 mb-4">
                            <div class="col-12 col-lg-6">
                                <label class="text-muted small fw-medium d-block mb-2" for="discography-search">Search the catalogue:</label>
                                <div class="input-group search-bar">
                                    <span class="input-group-text" id="discography-search-icon"><i class="fas fa-search"></i></span>
                                    <input class="form-control" id="discography-search" type="search" autocomplete="off" aria-describedby="discography-search-icon" placeholder="Search title, artist, year...">
                                    <button class="btn btn-outline-secondary" id="discography-search-clear" type="button">Clear</button>
                                </div>
                                <p class="text-muted small mb-0 mt-2" aria-live="polite" id="discography-search-feedback"></p>
                            </div>
                            
                            <div class="col-12 col-lg-6">
                                <label class="text-muted small fw-medium d-block mb-2" for="sort-by">Sort By:</label>
                                <select class="form-select" id="sort-by" aria-label="Sort discography releases">
                                    <option value="date-desc">Release Date (Newest First)</option>
                                    <option value="date-asc">Release Date (Oldest First)</option>
                                    <option value="title-asc">Title (A-Z)</option>
                                    <option value="artist-asc">Artist (A-Z)</option>
                                </select>
                            </div>
                        </div>
                    
                        <div class="row mb-4 g-3">
                            <div class="col-12">
                                <label class="text-muted small fw-medium d-block mb-2">Type:</label>
                                <div class="d-flex flex-wrap gap-2" role="toolbar" aria-label="Filter releases by type">
                                    <button class="filter-btn filter-btn-active" data-category="all"><i class="fas me-2 fa-compact-disc"></i> All</button>
                                    <button class="filter-btn filter-btn-inactive" data-category="favorites"><i class="fas me-2 fa-star"></i> Favorites</button>
                                    <button class="filter-btn filter-btn-inactive" data-category="album"><i class="fas me-2 fa-record-vinyl"></i> Albums</button>
                                    <button class="filter-btn filter-btn-inactive" data-category="ep"><i class="fas me-2 fa-copy"></i> EPs</button>
                                    <button class="filter-btn filter-btn-inactive" data-category="single"><i class="fas me-2 fa-music"></i> Singles</button>
                                    <button class="filter-btn filter-btn-inactive" data-category="collab"><i class="fas me-2 fa-handshake"></i> Collabs</button>
                                </div>
                            </div>
                        </div>
                    
                        <div class="row g-4">
                            <div class="col-12 col-lg-6">
                                <label class="text-muted small fw-medium d-block mb-2" for="artist-filter">Artist:</label>
                                <select class="form-select" id="artist-filter">
                                    <option value="all">All Artists</option>
                                </select>
                            </div>
                        
                            <div class="col-12 col-lg-6">
                                <label class="text-muted small fw-medium d-block mb-2">Year Range:</label>
                                <div class="d-flex gap-3 align-items-center year-range">
                                    <input class="form-range" id="year-min" type="range" aria-label="Minimum year" max="2030" min="2019" value="2019">
                                    <input class="form-range" id="year-max" type="range" aria-label="Maximum year" max="2030" min="2019" value="2030">
                                </div>
                                <div class="text-muted small d-flex gap-3">
                                    <span>From <strong id="year-min-label"></strong></span>
                                    <span>To <strong id="year-max-label"></strong></span>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            
                <!-- Grid Region -->
                <section aria-label="Music releases" id="releases-section">
                    <div class="row g-4 g-md-5 row-cols-2 row-cols-lg-4 row-cols-md-3 row-cols-xl-5" aria-live="polite" id="releases-grid" role="region"></div>
                    
                    <div class="text-muted mt-8 text-center" id="loading-state">
                        <i class="fas fa-compact-disc fa-spin fs-1 text-gradient"></i>
                        <p class="fs-5 mt-4">Accessing Discography...</p>
                    </div>
                
                    <div class="text-center mt-8 d-none text-danger" id="error-state">
                        <p class="fs-5"><strong>ERROR:</strong> Failed to retrieve discography. Please refresh.</p>
                    </div>
                
                    <div class="text-muted mt-8 text-center d-none" id="no-releases-message">
                        <p class="fs-5">No releases found in this category.</p>
                    </div>
                </section>
            </main>
        
            <footer id="footer-container"></footer>
        </div>
    
        <!-- Scripts -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js" defer></script>
        <script src="js/main.js" defer></script>
    </body>
</html>
